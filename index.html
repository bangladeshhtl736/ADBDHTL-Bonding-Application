<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTL Bonding Parameter & Service Report System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#CC0000',
                            darkred: '#990000',
                            navy: '#0F172A',
                            slate: '#1E293B',
                            light: '#F8FAFC'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Bengali', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navbar Header -->
    <header class="no-print bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Title -->
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('dashboard')">
                    <div class="bg-brand-red text-white p-2 rounded-lg font-black text-xl tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-industry"></i>
                        <span>HTL</span>
                    </div>
                    <div>
                        <h1 class="font-bold text-base sm:text-lg leading-tight">Bonding System Portal</h1>
                        <p class="text-[11px] text-slate-400">Avery Dennison / HTL Service Manager</p>
                    </div>
                </div>

                <!-- Navigation Tabs (Desktop) -->
                <nav class="hidden md:flex items-center space-x-1 lg:space-x-2 text-xs lg:text-sm font-medium">
                    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn px-3 py-2 rounded-md bg-brand-red text-white flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-file-contract"></i> Report Gen
                    </button>
                    <button onclick="switchTab('calculator')" id="nav-calculator" class="nav-btn px-3 py-2 rounded-md text-slate-300 hover:bg-slate-800 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-calculator"></i> Calculator
                    </button>
                    <button onclick="switchTab('handling')" id="nav-handling" class="nav-btn px-3 py-2 rounded-md text-slate-300 hover:bg-slate-800 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-list-check"></i> Instructions
                    </button>
                    <button onclick="switchTab('solution')" id="nav-solution" class="nav-btn px-3 py-2 rounded-md text-slate-300 hover:bg-slate-800 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-screwdriver-wrench"></i> Solution Hub
                    </button>
                    <button onclick="switchTab('support')" id="nav-support" class="nav-btn px-3 py-2 rounded-md text-slate-300 hover:bg-slate-800 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-headset"></i> Support
                    </button>
                    <button onclick="switchTab('admin')" id="nav-admin" class="nav-btn px-3 py-2 rounded-md text-slate-300 hover:bg-slate-800 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-user-gear"></i> Admin Panel
                    </button>
                </nav>

                <!-- Action Button -->
                <div class="flex items-center gap-2">
                    <button onclick="openGithubModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-200 rounded-lg flex items-center gap-1.5 transition">
                        <i class="fa-brands fa-github text-brand-red text-sm"></i>
                        <span class="hidden sm:inline">GitHub Pages গাইড</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Menu Sub-bar -->
        <div class="md:hidden border-t border-slate-800 bg-slate-900/90 px-2 py-2 flex items-center justify-around text-xs overflow-x-auto custom-scrollbar">
            <button onclick="switchTab('dashboard')" class="p-1.5 text-center text-slate-300">Report</button>
            <button onclick="switchTab('calculator')" class="p-1.5 text-center text-slate-300">Calc</button>
            <button onclick="switchTab('handling')" class="p-1.5 text-center text-slate-300">Rules</button>
            <button onclick="switchTab('solution')" class="p-1.5 text-center text-slate-300">Solution</button>
            <button onclick="switchTab('support')" class="p-1.5 text-center text-slate-300">Support</button>
            <button onclick="switchTab('admin')" class="p-1.5 text-center text-slate-300">Admin</button>
        </div>
    </header>

    <main class="flex-grow p-3 sm:p-6 md:p-8 max-w-7xl mx-auto w-full">
        <!-- Dynamic Page Sections -->
        <div id="page-dashboard" class="page-content space-y-6"></div>
        <div id="page-calculator" class="page-content hidden space-y-6"></div>
        <div id="page-handling" class="page-content hidden space-y-6"></div>
        <div id="page-solution" class="page-content hidden space-y-6"></div>
        <div id="page-support" class="page-content hidden space-y-6"></div>
        <div id="page-admin" class="page-content hidden space-y-6"></div>
    </main>

    <!-- GitHub Hosting Guide Modal -->
    <div id="githubModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-brands fa-github text-2xl text-brand-red"></i>
                    <h3 class="font-bold text-base sm:text-lg">গিটহাব পেজেসে (GitHub Pages) অনলাইন সাইট লাইভ করার নিয়ম</h3>
                </div>
                <button onclick="closeGithubModal()" class="text-slate-400 hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto custom-scrollbar space-y-4 text-xs sm:text-sm text-slate-700 leading-relaxed">
                <p class="bg-emerald-50 text-emerald-800 p-3 rounded-lg border border-emerald-200 font-medium">
                    <i class="fa-solid fa-circle-check mr-1"></i> আপনার সব কটি ফাইল (index.html, style.css, script.js এবং কম্পোনেন্ট ফাইলগুলো) গিটহাবে একসাথে আপলোড করুন। গিটহাবে আপলোড করলেই সাইটটি সরাসরি লাইভ কাজ করা শুরু করবে!
                </p>
            </div>
            <div class="bg-slate-100 p-4 border-t text-right">
                <button onclick="closeGithubModal()" class="px-5 py-2 bg-slate-800 text-white font-bold text-xs rounded-lg">ঠিক আছে</button>
            </div>
        </div>
    </div>

    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
