<script>
    // ১. ডেটা স্ট্রাকচার ইনিশিয়ালাইজেশন (Local Storage থেকে লোড করা)
    let appData = JSON.parse(localStorage.getItem('adminMasterData')) || {
        customers: [],
        rbos: {},    // format: { "Customer1": ["RBO1", "RBO2"] }
        items: {}    // format: { "Customer1": ["Item1", "Item2"] }
    };

    // পেজ লোড হওয়ার পর ডেটা রেন্ডার করা
    document.addEventListener('DOMContentLoaded', () => {
        // যদি পূর্বে লগইন করা থাকে তবে সেশন ধরে রাখার চেক করতে পারেন
        renderAllData();
    });

    // ডেটা Local Storage এ সেভ করার ফাংশন
    function saveData() {
        localStorage.setItem('adminMasterData', JSON.stringify(appData));
        renderAllData();
    }

    // ২. এডমিন লগইন এবং লগআউট হ্যান্ডলিং
    function handleAdminLogin() {
        const user = document.getElementById('adminUser').value;
        const pass = document.getElementById('adminPass').value;
        const errorMsg = document.getElementById('loginError');

        // ডিফল্ট লগইন ক্রিডেনশিয়াল (username: admin, password: admin123)
        if (user === 'admin' && pass === 'admin123') {
            document.getElementById('adminLoginBox').classList.add('hidden');
            document.getElementById('adminDashboardBox').classList.remove('hidden');
            errorMsg.classList.add('hidden');
            renderAllData();
        } else {
            errorMsg.classList.remove('hidden');
        }
    }

    function handleAdminLogout() {
        document.getElementById('adminLoginBox').classList.remove('hidden');
        document.getElementById('adminDashboardBox').classList.add('hidden');
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPass').value = '';
    }

    // ৩. সাব-ট্যাব সুইচার (Tabs Switching)
    function switchAdminSubTab(tabName) {
        // সকল কন্টেন্ট লুকানো
        document.querySelectorAll('.admin-sub-content').forEach(el => el.classList.add('hidden'));
        
        // সকল বাটনের কালার রিসেট করা
        document.querySelectorAll('.admin-sub-btn').forEach(btn => {
            btn.classList.remove('bg-slate-900', 'text-white');
            btn.classList.add('bg-slate-200', 'text-slate-700');
        });

        // সিলেক্টেড ট্যাব ও বাটন অ্যাক্টিভ করা
        document.getElementById(`adminSubTab-${tabName}`).classList.remove('hidden');
        const activeBtn = document.getElementById(`adminSubBtn-${tabName}`);
        activeBtn.classList.remove('bg-slate-200', 'text-slate-700');
        activeBtn.classList.add('bg-slate-900', 'text-white');
    }

    // ৪. Customer যোগ করা
    function addAdminCustomer() {
        const input = document.getElementById('newCustomerInput');
        const customerName = input.value.trim().toUpperCase();

        if (!customerName) {
            alert('দয়া করে কাস্টমারের নাম লিখুন!');
            return;
        }

        if (appData.customers.includes(customerName)) {
            alert('এই কাস্টমারটি ইতিমধ্যেই যুক্ত করা আছে!');
            return;
        }

        appData.customers.push(customerName);
        appData.rbos[customerName] = [];
        appData.items[customerName] = [];

        input.value = '';
        saveData();
    }

    // ৫. RBO যোগ করা
    function addAdminRBO() {
        const customerSelect = document.getElementById('rboCustomerSelect');
        const input = document.getElementById('newRBOInput');
        const selectedCustomer = customerSelect.value;
        const rboName = input.value.trim().toUpperCase();

        if (!selectedCustomer) {
            alert('প্রথমে একটি কাস্টমার সিলেক্ট করুন!');
            return;
        }
        if (!rboName) {
            alert('দয়া করে RBO নাম লিখুন!');
            return;
        }

        if (!appData.rbos[selectedCustomer]) {
            appData.rbos[selectedCustomer] = [];
        }

        if (appData.rbos[selectedCustomer].includes(rboName)) {
            alert('এই কাস্টমারের অধীনে এই RBO আগেই যুক্ত করা আছে!');
            return;
        }

        appData.rbos[selectedCustomer].push(rboName);
        input.value = '';
        saveData();
    }

    // ৬. Item Reference যোগ করা
    function addAdminItem() {
        const customerSelect = document.getElementById('itemCustomerSelect');
        const input = document.getElementById('newItemInput');
        const selectedCustomer = customerSelect.value;
        const itemCode = input.value.trim().toUpperCase();

        if (!selectedCustomer) {
            alert('প্রথমে একটি কাস্টমার সিলেক্ট করুন!');
            return;
        }
        if (!itemCode) {
            alert('দয়া করে Item Reference কোড লিখুন!');
            return;
        }

        if (!appData.items[selectedCustomer]) {
            appData.items[selectedCustomer] = [];
        }

        if (appData.items[selectedCustomer].includes(itemCode)) {
            alert('এই Item Reference কোডটি আগেই সেভ করা আছে!');
            return;
        }

        appData.items[selectedCustomer].push(itemCode);
        input.value = '';
        saveData();
    }

    // ৭. ডিলিট ফাংশনালিটি
    function deleteCustomer(index) {
        const customerName = appData.customers[index];
        if (confirm(`আপনি কি "${customerName}" কে ডিলিট করতে চান?`)) {
            appData.customers.splice(index, 1);
            delete appData.rbos[customerName];
            delete appData.items[customerName];
            saveData();
        }
    }

    function deleteRBO(customer, index) {
        if (confirm(`RBO টি মুছে ফেলতে চান?`)) {
            appData.rbos[customer].splice(index, 1);
            saveData();
        }
    }

    function deleteItem(customer, index) {
        if (confirm(`Item Reference টি মুছে ফেলতে চান?`)) {
            appData.items[customer].splice(index, 1);
            saveData();
        }
    }

    // ৮. ডেটা ইন্টারফেসে প্রদর্শন (UI Rendering)
    function renderAllData() {
        renderCustomers();
        renderDropdowns();
        renderRBOs();
        renderItems();
    }

    function renderCustomers() {
        const list = document.getElementById('adminCustomerList');
        const countTag = document.getElementById('customerCountTag');
        list.innerHTML = '';
        
        countTag.innerText = `${appData.customers.length} Customers`;

        appData.customers.forEach((cust, index) => {
            list.innerHTML += `
                <li class="py-2 flex justify-between items-center">
                    <span>${cust}</span>
                    <button onclick="deleteCustomer(${index})" class="text-red-500 hover:text-red-700">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </li>
            `;
        });
    }

    function renderDropdowns() {
        const rboSelect = document.getElementById('rboCustomerSelect');
        const itemSelect = document.getElementById('itemCustomerSelect');

        let options = appData.customers.length === 0 
            ? `<option value="">কোন কাস্টমার পাওয়া যায়নি</option>`
            : appData.customers.map(c => `<option value="${c}">${c}</option>`).join('');

        rboSelect.innerHTML = options;
        itemSelect.innerHTML = options;

        // ড্রপডাউন পরিবর্তন হলে রেন্ডার আপডেট করা
        rboSelect.onchange = renderRBOs;
        itemSelect.onchange = renderItems;
    }

    function renderRBOs() {
        const selectedCustomer = document.getElementById('rboCustomerSelect').value;
        const list = document.getElementById('adminRBOList');
        const countTag = document.getElementById('rboCountTag');
        list.innerHTML = '';

        if (!selectedCustomer || !appData.rbos[selectedCustomer]) {
            countTag.innerText = `0 RBOs`;
            return;
        }

        const rboList = appData.rbos[selectedCustomer];
        countTag.innerText = `${rboList.length} RBOs`;

        rboList.forEach((rbo, index) => {
            list.innerHTML += `
                <li class="py-2 flex justify-between items-center">
                    <span>${rbo} <span class="text-[10px] text-slate-400">(${selectedCustomer})</span></span>
                    <button onclick="deleteRBO('${selectedCustomer}', ${index})" class="text-red-500 hover:text-red-700">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </li>
            `;
        });
    }

    function renderItems() {
        const selectedCustomer = document.getElementById('itemCustomerSelect').value;
        const list = document.getElementById('adminItemList');
        const countTag = document.getElementById('itemCountTag');
        list.innerHTML = '';

        if (!selectedCustomer || !appData.items[selectedCustomer]) {
            countTag.innerText = `0 Items`;
            return;
        }

        const itemList = appData.items[selectedCustomer];
        countTag.innerText = `${itemList.length} Items`;

        itemList.forEach((item, index) => {
            list.innerHTML += `
                <li class="py-2 flex justify-between items-center">
                    <span>${item} <span class="text-[10px] text-slate-400">(${selectedCustomer})</span></span>
                    <button onclick="deleteItem('${selectedCustomer}', ${index})" class="text-red-500 hover:text-red-700">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </li>
            `;
        });
    }
</script>
